server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name booran-sales-floor.goodshowroom.com www.booran-sales-floor.goodshowroom.com;

    ssl_certificate /etc/letsencrypt/live/booran-sales-floor.goodshowroom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/booran-sales-floor.goodshowroom.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 3m;
    server_tokens off;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 4;
    gzip_types application/json application/javascript text/javascript text/css text/plain text/xml application/xml application/xml+rss image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:4101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
    }
}

