server {
    listen 80;
    listen [::]:80;
    server_name booran-sales-floor.goodshowroom.com www.booran-sales-floor.goodshowroom.com
                booran-sales-floor-backend.goodshowroom.com www.booran-sales-floor-backend.goodshowroom.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/booran/shared/acme;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}
